[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "argklass"
dynamic = ["version"]
description = "Argparse generator from dataclass"
readme = "README.rst"
license = "BSD-3-Clause"
requires-python = ">=3.8"
authors = [
    { name = "Delaunay", email = "pierre@delaunay.io" },
]
classifiers = [
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "importlib_resources",
    "hjson",
]

[project.optional-dependencies]
plugins = ["importlib_resources"]

[project.urls]
Documentation = "https://argklass.readthedocs.io"
Repository = "https://github.com/kiwi-lang/argklass"

[tool.setuptools.packages.find]
include = ["argklass*"]

[tool.setuptools_scm]
version_file = "argklass/_version.py"
